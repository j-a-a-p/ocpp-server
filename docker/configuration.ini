# Template of the configuration of the local Docker stack. The cloud-api container
# fills in the @PUBLIC_URL@ placeholder when it starts and writes the result to
# /etc/ocpp-server/configuration.ini (see docker-compose.yml).
# Everything here is a throwaway value for local development, nothing is a real secret.

[AWS]
REGION = eu-central-1

[SimpleEmailService]
# Fake credentials, the mail goes to the mock SES server instead of AWS.
SES_ACCESS_KEY = local-dev
SES_SECRET_KEY = local-dev
SES_ENDPOINT_URL = http://mock-ses:8025

[Cloud]
JWT_SECRET = local-development-secret-do-not-use-anywhere-else-0123456789

[ResidentUI]
# Login links in the emails start with this address, the one the browser uses.
INVITE_URL = @PUBLIC_URL@/resident-ui
