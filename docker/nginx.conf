# Local counterpart of the Apache virtual host in infra/apt.aircokopen.nu-le-ssl.conf:
#   /api/            -> cloud API
#   /ws/<station>    -> station controller (OCPP over WebSocket)
#   /management-ui/  and /resident-ui/ -> the built single page apps
#   /                -> the website that promotes the service (infra/web/index.html)

# Names are looked up when a request comes in, so the web server starts even if
# a container is restarting, and follows it to its new address.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;
    root /srv/www;
    index index.html;

    # Redirect to a path only: nginx listens on port 80 inside the container, so a full
    # address would lose the published port (8180).
    absolute_redirect off;

    # Written by the station controller into a volume shared with this container.
    location = /meter_values.json {
        alias /srv/meter/meter_values.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /meter_values.csv {
        alias /srv/meter/meter_values.csv;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /api/ {
        set $cloud_api http://cloud-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $cloud_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        set $station_controller http://station-controller:9000;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $station_controller;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location = /management-ui { return 301 /management-ui/; }
    location /management-ui/ {
        try_files $uri $uri/ /management-ui/index.html;
    }

    location = /resident-ui { return 301 /resident-ui/; }
    location /resident-ui/ {
        try_files $uri $uri/ /resident-ui/index.html;
    }
}
