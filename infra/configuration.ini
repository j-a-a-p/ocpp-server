# Source of /etc/ocpp-server/configuration.ini on the server.
# Committed to git, so it holds no secrets. Words between two @ signs are placeholders
# that infra/deploy-hetzner.sh fills in: the secrets come from the git-ignored
# infra/.hetzner.env, the domain is the one the server is deployed on.

[AWS]
REGION = eu-central-1

[SimpleEmailService]
SES_ACCESS_KEY = @SES_ACCESS_KEY@
SES_SECRET_KEY = @SES_SECRET_KEY@

[Cloud]
JWT_SECRET = @JWT_SECRET@
API_KEY = @API_KEY@

[ResidentUI]
INVITE_URL = https://@DOMAIN@/resident-ui
